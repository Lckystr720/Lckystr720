
name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Lckystr720&show_icons=true&include_all_commits=true&rank_icon=default&custom_title=My%20GitHub%20Statistics&bg_color=0B1220&title_color=38BDF8&text_color=CBD5E1&icon_color=60A5FA&ring_color=3B82F6&border_color=1E293B
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update GitHub statistics" || exit 0
          git push
